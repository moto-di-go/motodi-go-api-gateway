server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: motodi-go-api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  http:
    client:
      connect-timeout: ${GATEWAY_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${GATEWAY_HTTP_READ_TIMEOUT:6s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      backendCore:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      backendAi:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
  timelimiter:
    instances:
      backendCore:
        timeoutDuration: ${GATEWAY_CORE_TIMEOUT:5s}
        cancelRunningFuture: true
      backendAi:
        timeoutDuration: ${GATEWAY_AI_TIMEOUT:3s}
        cancelRunningFuture: true

motodigo:
  gateway:
    backend-core-base-url: ${BACKEND_CORE_BASE_URL:http://localhost:8081}
    backend-ai-base-url: ${BACKEND_AI_BASE_URL:http://localhost:8000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    auth:
      jwt-secret: ${JWT_SECRET:change-me-to-at-least-32-bytes-for-hs256}
      issuer-url: ${JWT_ISSUER_URL:http://localhost:8080}
      audience: ${JWT_AUDIENCE:motodi-go-api}
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
      auth:
        capacity: ${GATEWAY_RATE_LIMIT_AUTH_CAPACITY:5}
        refill-tokens: ${GATEWAY_RATE_LIMIT_AUTH_REFILL_TOKENS:1}
        refill-period-seconds: ${GATEWAY_RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS:120}
      otp:
        capacity: ${GATEWAY_RATE_LIMIT_OTP_CAPACITY:5}
        refill-tokens: ${GATEWAY_RATE_LIMIT_OTP_REFILL_TOKENS:1}
        refill-period-seconds: ${GATEWAY_RATE_LIMIT_OTP_REFILL_PERIOD_SECONDS:120}
      payment:
        capacity: ${GATEWAY_RATE_LIMIT_PAYMENT_CAPACITY:10}
        refill-tokens: ${GATEWAY_RATE_LIMIT_PAYMENT_REFILL_TOKENS:10}
        refill-period-seconds: ${GATEWAY_RATE_LIMIT_PAYMENT_REFILL_PERIOD_SECONDS:60}
      callback:
        capacity: ${GATEWAY_RATE_LIMIT_CALLBACK_CAPACITY:60}
        refill-tokens: ${GATEWAY_RATE_LIMIT_CALLBACK_REFILL_TOKENS:60}
        refill-period-seconds: ${GATEWAY_RATE_LIMIT_CALLBACK_REFILL_PERIOD_SECONDS:60}
    integrations:
      mobile-money:
        enabled: ${GATEWAY_MOBILE_MONEY_CALLBACK_ENABLED:true}
        idempotency-ttl: ${GATEWAY_CALLBACK_IDEMPOTENCY_TTL:48h}
        pending-ttl: ${GATEWAY_CALLBACK_PENDING_TTL:60s}
        providers:
          mtn:
            hmac-secret: ${MTN_CALLBACK_HMAC_SECRET:change-me-mtn-callback-hmac-secret}
            allowed-source-ips: []
          orange:
            hmac-secret: ${ORANGE_CALLBACK_HMAC_SECRET:change-me-orange-callback-hmac-secret}
            allowed-source-ips: []
          aggregator:
            hmac-secret: ${AGGREGATOR_CALLBACK_HMAC_SECRET:change-me-aggregator-callback-hmac-secret}
            allowed-source-ips: []
