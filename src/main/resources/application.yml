spring:
  application:
    name: motodi-go-api-gateway

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

motodigo:
  gateway:
    backend-core-base-url: ${BACKEND_CORE_BASE_URL:http://localhost:8081}
    backend-ai-base-url: ${BACKEND_AI_BASE_URL:http://localhost:8000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
