  /api/v1/integrations/mobile-money/callback:
    post:
      tags: [Wallet/Payments]
      summary: Receive mobile money provider callback (legacy alias).
      description: >
        Legacy alias for aggregator callbacks. Prefer provider-specific paths.
        GATE-INTEGRATIONS-001 verifies X-Signature, origin allowlist and edge idempotency
        before forwarding once to backend-core. CORE-PAY-001 credits the wallet at most once.
      operationId: mobileMoneyCallback
      security:
        - CallbackSignature: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Provider
          in: header
          required: false
          schema:
            type: string
            enum: [mtn, orange, aggregator]
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileMoneyCallbackRequest'
      responses:
        '200':
          description: Callback acknowledged (including idempotent replays).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
