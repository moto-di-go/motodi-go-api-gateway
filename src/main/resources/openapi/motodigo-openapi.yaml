          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (capped at 100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated ledger movements (immutable entries).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPageResponse'
        '401':
