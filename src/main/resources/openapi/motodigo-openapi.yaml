  /api/v1/intercity/announcements/{id}/bookings:
    post:
      tags: [Intercity]
      summary: Subscribe to an intercity announcement (CORE-BOOK-001).
      description: >
        Creates a `PENDING` booking for the active passenger profile.
        **Gateway RBAC:** JWT must include permission `PASSENGER_BOOK_RIDE` (issued only when the
        active profile is `PASSENGER`). After creating or activating a passenger profile, call
        `POST /api/v1/auth/login` or `POST /api/v1/auth/refresh` and replace the Bearer token in
        Authorize — a stale token yields gateway `403 ACCESS_DENIED`.
        Seats are **not** decremented yet; the announcement owner must confirm to acquire a
        transactional SeatLock. Refused when the announcement is not `PUBLISHED`, has insufficient
        remaining seats, departure is past, or the passenger already has an active booking on this
        announcement. Default confirmation TTL is 10 minutes (`expiresAt`).
        Common 409 codes: `BOOKING_NOT_AVAILABLE`, `BOOKING_DUPLICATE`.
      operationId: bookIntercityAnnouncement
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created in `PENDING` status (awaiting owner confirmation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Validation failed (`VALIDATION_FAILED` / `BOOKING_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Active passenger profile required (`BOOKING_FORBIDDEN` / `ACTIVE_PROFILE_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >
            Announcement full/unavailable (`BOOKING_NOT_AVAILABLE`) or duplicate active booking
            (`BOOKING_DUPLICATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [Intercity]
      summary: List bookings for an announcement owned by the active transporter/agency (CORE-BOOK-001).
      description: >
        Owner-only listing (active transporter/agency profile must own the announcement). Used so
        both parties can see subscription status after CORE-BOOK-001.
      operationId: listAnnouncementBookings
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Id'
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (capped at 100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated bookings for the announcement (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPageResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Caller is not the announcement owner (`BOOKING_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Announcement not found (`BOOKING_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/bookings/mine:
    get:
      tags: [Intercity]
      summary: List bookings of the active passenger profile (CORE-BOOK-001).
      description: >
        Passenger-side status list for the active `PASSENGER` profile. Complements owner listing so
        both parties see booking status.
      operationId: listMyBookings
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
