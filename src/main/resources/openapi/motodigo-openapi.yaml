openapi: 3.0.3
info:
  title: MOTO'DI GO API Gateway
  version: 1.0.0
  description: Contractual API v1 exposed by the gateway. Some operations describe future modules; calls still pass through the gateway.
servers:
  - url: /
tags:
  - name: Auth
  - name: Profiles
  - name: KYC
  - name: SIG
  - name: Intercity
  - name: AI
  - name: Wallet/Payments
    description: >
      CORE-WALLET-001 (implemented): account-scoped wallet balance and immutable ledger reads.
      The wallet belongs to the user account (JWT subject), not the active profile.
      CORE-PAY-001/002 (future): Mobile Money deposits, callbacks and ride payments.
  - name: Offline/NFC
  - name: Trips
  - name: Support
  - name: Admin
  - name: Realtime
  - name: Health
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CallbackSignature:
      type: apiKey
      in: header
      name: X-Signature
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client correlation id propagated by the gateway.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiError:
      type: object
      required: [errorCode, message, timestamp]
      properties:
        errorCode:
          type: string
          example: OTP_INVALID
        message:
          type: string
          example: Request cannot be completed.
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
    GenericObject:
      type: object
      additionalProperties: true
    WalletStatus:
      type: string
      description: Lifecycle status of the account wallet.
      enum: [ACTIVE, FROZEN, CLOSED]
    LedgerEntryType:
      type: string
      description: >
        Accounting movement type. CORE-WALLET-001 settles CREDIT and DEBIT on currentBalance.
        REVERSAL, HOLD and RELEASE are reserved for refunds / NFC (later tickets).
      enum: [CREDIT, DEBIT, REVERSAL, HOLD, RELEASE]
    WalletResponse:
      type: object
      description: >
        Unique electronic wallet of the authenticated account (one wallet per user_id).
        Currency is always XAF (FCFA). Switching the active profile does not change this wallet.
      required: [id, currency, currentBalance, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
          description: ISO 4217 currency code. Fixed to XAF for MVP.
          enum: [XAF]
          example: XAF
        currentBalance:
          type: number
          format: double
          minimum: 0
          description: Settled balance derived from CREDIT minus DEBIT ledger entries.
          example: 15000.00
        status:
          $ref: '#/components/schemas/WalletStatus'
        createdAt:
          type: string
          format: date-time
    LedgerEntryResponse:
      type: object
      description: Immutable append-only ledger movement (audited, never updated in place).
      required: [id, type, amount, currency, bookedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/LedgerEntryType'
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 3000.00
        currency:
          type: string
          enum: [XAF]
          example: XAF
        reference:
          type: string
          nullable: true
          example: paiement-trajet
        bookedAt:
          type: string
          format: date-time
          description: Timestamp when the movement was booked.
    LedgerPageResponse:
      type: object
      description: Paginated ledger page, newest movements first.
      required: [entries, page, size, hasMore]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntryResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
          description: True when another page of movements is available.
    DocumentType:
      type: string
      enum: [CNI, DRIVER_LICENSE, VEHICLE_REGISTRATION, INSURANCE, PROFILE_PHOTO]
    DocumentStatus:
      type: string
      enum: [UPLOADED, ENCRYPTED, PENDING_REVIEW, ACCEPTED, REJECTED, EXPIRED]
    OfficialDocumentResponse:
      type: object
      required: [id, profileId, type, status, mimeType, sizeBytes, uploadedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/DocumentType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileName:
          type: string
          nullable: true
          example: carte-grise.jpg
        mimeType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
        rejectionReason:
          type: string
          nullable: true
        uploadedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentRequirementResponse:
      type: object
      required: [type, required, uploaded]
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        required:
          type: boolean
        uploaded:
          type: boolean
        latestStatus:
          allOf:
            - $ref: '#/components/schemas/DocumentStatus'
          nullable: true
    KycDocumentsResponse:
      type: object
      required: [profileId, profileType, profileValidationStatus, requirements, documents]
      properties:
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [MOTOTAXI, TRANSPORTER]
        profileValidationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRequirementResponse'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/OfficialDocumentResponse'
    UploadKycDocumentResponse:
      type: object
      required: [profileId, profileValidationStatus, document, requirements]
      properties:
        profileId:
          type: string
          format: uuid
        profileValidationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        document:
          $ref: '#/components/schemas/OfficialDocumentResponse'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRequirementResponse'
    AdminKycDocumentResponse:
      type: object
      required: [profileId, profileType, profileValidationStatus, displayName, documents, decisions]
      properties:
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [MOTOTAXI, TRANSPORTER]
        profileValidationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        displayName:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/OfficialDocumentResponse'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDecisionResponse'
    AdminKycQueueItemResponse:
      type: object
      required: [profileId, profileType, profileValidationStatus, displayName, documentsCount, pendingDocumentsCount]
      properties:
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [MOTOTAXI, TRANSPORTER]
        profileValidationStatus:
          type: string
          enum: [PENDING]
        displayName:
          type: string
        documentsCount:
          type: integer
          format: int64
        pendingDocumentsCount:
          type: integer
          format: int64
        oldestPendingDocumentAt:
          type: string
          format: date-time
          nullable: true
    KycDecision:
      type: string
      enum: [VALIDATE, REJECT]
    AdminKycDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/KycDecision'
        reason:
          type: string
          nullable: true
          description: Required when decision is REJECT.
    AdminKycDecisionResponse:
      type: object
      required: [profileId, profileValidationStatus, decision, decisionRecord]
      properties:
        profileId:
          type: string
          format: uuid
        profileValidationStatus:
          type: string
          enum: [VALIDATED, REJECTED]
        decision:
          $ref: '#/components/schemas/KycDecision'
        decisionRecord:
          $ref: '#/components/schemas/ValidationDecisionResponse'
    ValidationDecisionResponse:
      type: object
      required: [id, profileId, decision, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        adminProfileId:
          type: string
          format: uuid
          nullable: true
        decision:
          $ref: '#/components/schemas/KycDecision'
        reason:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
    PhoneRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          example: "+237699001122"
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [password, cguAccepted]
          properties:
            password:
              type: string
              format: password
              minLength: 8
            fullName:
              type: string
              maxLength: 160
            email:
              type: string
              format: email
            cguAccepted:
              type: boolean
    RegisterResponse:
      type: object
      required: [userId, phoneNumber, status, otpExpiresAt]
      properties:
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
        status:
          type: string
          example: PENDING_PHONE_VERIFICATION
        otpExpiresAt:
          type: string
          format: date-time
    OtpVerifyRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [code]
          properties:
            purpose:
              type: string
              description: Defaults to REGISTRATION when omitted.
              enum: [REGISTRATION, LOGIN, PASSWORD_RESET, PAYMENT_CONFIRMATION]
            code:
              type: string
              pattern: '^[0-9]+$'
    OtpResendRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          properties:
            purpose:
              type: string
              description: Defaults to REGISTRATION when omitted.
              enum: [REGISTRATION, LOGIN, PASSWORD_RESET, PAYMENT_CONFIRMATION]
    OtpVerifyResponse:
      type: object
      required: [userId, phoneNumber, status]
      properties:
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
        status:
          type: string
          example: ACTIVE
    OtpResendResponse:
      type: object
      required: [phoneNumber, purpose, otpExpiresAt]
      properties:
        phoneNumber:
          type: string
        purpose:
          type: string
        otpExpiresAt:
          type: string
          format: date-time
    LoginRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [password]
          properties:
            password:
              type: string
              format: password
            deviceId:
              type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthTokenResponse:
      type: object
      required: [tokenType, accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt, sessionId, userId, phoneNumber, roles, profiles, permissions]
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileTokenSummary'
        activeProfileId:
          type: string
          format: uuid
          nullable: true
        activeProfileType:
          type: string
          nullable: true
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        permissions:
          type: array
          items:
            type: string
    ProfileTokenSummary:
      type: object
      required: [id, type, validationStatus, active]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        validationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        active:
          type: boolean
    CreateProfileRequest:
      type: object
      required: [type, displayName]
      properties:
        type:
          type: string
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY]
        displayName:
          type: string
          maxLength: 120
        avatarUrl:
          type: string
          maxLength: 2048
        passenger:
          $ref: '#/components/schemas/PassengerProfileDetails'
        driver:
          $ref: '#/components/schemas/DriverProfileDetails'
        motoTaxi:
          $ref: '#/components/schemas/MotoTaxiProfileDetails'
        transporter:
          $ref: '#/components/schemas/TransporterProfileDetails'
        agency:
          $ref: '#/components/schemas/AgencyProfileDetails'
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 120
        avatarUrl:
          type: string
          maxLength: 2048
        passenger:
          $ref: '#/components/schemas/PassengerProfileDetails'
        driver:
          $ref: '#/components/schemas/DriverProfileDetails'
        motoTaxi:
          $ref: '#/components/schemas/MotoTaxiProfileDetails'
        transporter:
          $ref: '#/components/schemas/TransporterProfileDetails'
        agency:
          $ref: '#/components/schemas/AgencyProfileDetails'
    PassengerProfileDetails:
      type: object
      properties:
        preferredLanguage:
          type: string
          maxLength: 16
          example: fr
        emergencyContact:
          type: string
          maxLength: 20
          example: "+237699000001"
    DriverProfileDetails:
      type: object
      properties:
        availability:
          type: string
          readOnly: true
          enum: [AVAILABLE, OCCUPIED, OFFLINE]
        gpsConsent:
          type: boolean
        lastAvailabilityChangeAt:
          type: string
          format: date-time
          readOnly: true
    MotoTaxiProfileDetails:
      type: object
      properties:
        licenseNumber:
          type: string
          maxLength: 80
        operatingZone:
          type: string
          maxLength: 160
    TransporterProfileDetails:
      type: object
      properties:
        permitNumber:
          type: string
          maxLength: 80
        companyName:
          type: string
          maxLength: 160
    AgencyProfileDetails:
      type: object
      properties:
        legalName:
          type: string
          maxLength: 180
        tradeRegisterNumber:
          type: string
          maxLength: 80
        billingPlan:
          type: string
          maxLength: 80
    AdminProfileDetails:
      type: object
      readOnly: true
      properties:
        adminRole:
          type: string
        permissions:
          type: array
          items:
            type: string
    ProfileResponse:
      type: object
      required: [id, userId, type, validationStatus, displayName, averageRating, active, createdAt, updatedAt, allowedActions]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        validationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        averageRating:
          type: number
          format: double
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        passenger:
          $ref: '#/components/schemas/PassengerProfileDetails'
        driver:
          $ref: '#/components/schemas/DriverProfileDetails'
        motoTaxi:
          $ref: '#/components/schemas/MotoTaxiProfileDetails'
        transporter:
          $ref: '#/components/schemas/TransporterProfileDetails'
        agency:
          $ref: '#/components/schemas/AgencyProfileDetails'
        admin:
          $ref: '#/components/schemas/AdminProfileDetails'
        allowedActions:
          type: array
          items:
            type: string
    ResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [code, newPassword]
          properties:
            code:
              type: string
            newPassword:
              type: string
              format: password
              minLength: 8
    PaymentRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          enum: [XAF]
        provider:
          type: string
          enum: [MTN_MOMO, ORANGE_MONEY, AGGREGATOR, WALLET, NFC]
        phoneNumber:
          type: string
    PricingEstimateRequest:
      type: object
      required: [origin, destination]
      properties:
        origin:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/GeoPoint'
        serviceType:
          type: string
    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    ServerSentEvent:
      type: object
      properties:
        event:
          type: string
        id:
          type: string
        data:
          type: object
          additionalProperties: true
  responses:
    Accepted:
      description: Request accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
    Empty:
      description: Request completed without response body.
    Error:
      description: Stable error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
security:
  - BearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a phone account and send a registration OTP.
      operationId: registerAccount
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created pending phone verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an OTP for registration, login, payment, or reset.
      description: >
        On successful REGISTRATION OTP verification the account becomes ACTIVE and an XAF wallet is
        auto-created (CORE-WALLET-001). The wallet is tied to the user account, not to a profile.
      operationId: verifyOtp
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/otp/resend:
    post:
      tags: [Auth]
      summary: Resend an OTP subject to cooldown and quotas.
      operationId: resendOtp
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: OTP resend accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResendResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and create an access/refresh session.
      description: >
        Successful login also ensures an ACTIVE XAF wallet exists for the account (lazy backfill for
        legacy ACTIVE users without a wallet row — CORE-WALLET-001).
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate an opaque refresh token and issue a new access token.
      operationId: refreshSession
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session identified by the JWT sid claim.
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Send a password reset OTP with anti-enumeration behavior.
      operationId: forgotPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset a password with a valid reset OTP and revoke sessions.
      operationId: resetPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/profiles:
    get:
      tags: [Profiles]
      summary: List profiles owned by the authenticated user.
      operationId: listProfiles
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Profiles owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Profiles]
      summary: Create a user profile.
      operationId: createProfile
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
