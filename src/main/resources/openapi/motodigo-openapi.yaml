  /api/v1/wallet:
    get:
      tags: [Wallet/Payments]
      summary: Get the authenticated account wallet balance and status (CORE-WALLET-001).
      description: >
        Returns the unique wallet of the authenticated user account (JWT `sub`), independent of the
        active profile. Currency is XAF. If the account is ACTIVE but has no wallet row yet
        (legacy account), the backend auto-provisions an ACTIVE wallet with balance 0 before
        responding. Write operations (deposit / debit) are not exposed here; they go through
        CORE-PAY-* later.
      operationId: getWallet
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Account wallet summary (XAF, status, settled balance).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: >
            Wallet still missing after provisioning attempt (`WALLET_NOT_FOUND`). Unusual for an
            ACTIVE authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/wallet/ledger:
    get:
      tags: [Wallet/Payments]
      summary: List immutable wallet ledger movements, newest first (CORE-WALLET-001).
      description: >
        Paginated append-only accounting history for the authenticated account wallet. Same wallet
        regardless of active profile. Auto-provisions a missing wallet for legacy ACTIVE accounts
        before listing (empty entries when newly created).
      operationId: getWalletLedger
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (capped at 100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated ledger movements (immutable entries).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPageResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: Wallet still missing after provisioning attempt (`WALLET_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
