            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated passenger bookings (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPageResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Active passenger profile required (`BOOKING_FORBIDDEN` / `ACTIVE_PROFILE_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/bookings/{id}:
    get:
      tags: [Intercity]
      summary: Get a booking visible to the passenger or announcement owner (CORE-BOOK-001).
      description: >
        Returns booking detail when the active profile is either the passenger who subscribed or the
        transporter/agency that owns the announcement. Other profiles receive 403.
      operationId: getBooking
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Booking detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Neither passenger nor announcement owner (`BOOKING_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Booking not found (`BOOKING_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/bookings/{id}/confirm:
    post:
      tags: [Intercity]
      summary: Confirm a PENDING booking and lock seats (CORE-BOOK-001).
      description: >
        Announcement owner confirmation (`INTERCITY_BOOKING_CONFIRM`). Runs in one transaction:
        `SELECT … FOR UPDATE` on the announcement, insert SeatLock, decrement `remainingSeats`
        (announcement becomes `FULL` at 0), set booking to `PENDING_PAYMENT` with payment TTL
        (`expiresAt`, default 10 minutes). Concurrent confirms cannot over-consume seats; losers
        get 409 `NO_SEAT_AVAILABLE`. Ride payment itself is CORE-PAY-002.
      operationId: confirmBooking
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Booking moved to `PENDING_PAYMENT` with seats locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Not the announcement owner or missing `INTERCITY_BOOKING_CONFIRM`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Booking not found (`BOOKING_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >
            Not confirmable (`BOOKING_NOT_CONFIRMABLE`, e.g. not `PENDING` / confirmation TTL elapsed)
            or insufficient seats under lock (`NO_SEAT_AVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/bookings/{id}/cancel:
    post:
      tags: [Intercity]
      summary: Cancel a booking according to business rules (CORE-BOOK-001).
      description: >
        Passenger may cancel `PENDING`, `PENDING_PAYMENT` or `CONFIRMED`. Announcement owner may
        refuse `PENDING` or cancel after lock. `PAID` / `EXPIRED` / already `CANCELLED` are refused
        (`BOOKING_NOT_CANCELLABLE`). After departure (except plain `PENDING` without lock), cancel
        is refused. When a non-consumed SeatLock exists, seats are restored and the lock marked
        consumed. Requires `cancellationReason`.
      operationId: cancelBooking
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: Booking `CANCELLED`; seats released when a SeatLock existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Missing/invalid cancellation reason (`VALIDATION_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Neither passenger nor announcement owner (`BOOKING_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Booking not found (`BOOKING_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Business rules forbid cancellation (`BOOKING_NOT_CANCELLABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
