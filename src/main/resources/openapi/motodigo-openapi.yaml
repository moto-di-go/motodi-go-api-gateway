openapi: 3.0.3
info:
  title: MOTO'DI GO API Gateway
  version: 1.0.0
  description: Contractual API v1 exposed by the gateway. Some operations describe future modules; calls still pass through the gateway.
servers:
  - url: /
tags:
  - name: Auth
  - name: Profiles
  - name: KYC
  - name: SIG
  - name: Intercity
    description: >
      CORE-INTER-001 (implemented): intercity announcement CRUD and multicriteria search with
      deterministic widening suggestions when no results match.
      CORE-BOOK-001 (implemented): passenger subscription (`PENDING`), transporter/agency confirmation
      with transactional seat locks (`PENDING_PAYMENT`), status visibility for both parties,
      cancellation rules, and automatic expiration of unpaid/unconfirmed bookings.
      Ride payment after lock is CORE-PAY-002 (future): `POST /api/v1/bookings/{id}/pay`.
  - name: AI
  - name: Wallet/Payments
    description: >
      CORE-WALLET-001 (implemented): account-scoped wallet balance and immutable ledger reads.
      The wallet belongs to the user account (JWT subject), not the active profile.
      CORE-PAY-001 (implemented): Mobile Money deposit initiation, signed callback processing and
      admin reconciliation by external reference. CORE-PAY-002 (future): ride payments.
  - name: Offline/NFC
  - name: Trips
  - name: Support
  - name: Admin
  - name: Realtime
  - name: Health
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CallbackSignature:
      type: apiKey
      in: header
      name: X-Signature
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client correlation id propagated by the gateway.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiError:
      type: object
      required: [errorCode, message, timestamp]
      properties:
        errorCode:
          type: string
          example: OTP_INVALID
        message:
          type: string
          example: Request cannot be completed.
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
    GenericObject:
      type: object
      additionalProperties: true
    WalletStatus:
      type: string
      description: Lifecycle status of the account wallet.
      enum: [ACTIVE, FROZEN, CLOSED]
    LedgerEntryType:
      type: string
      description: >
        Accounting movement type. CORE-WALLET-001 settles CREDIT and DEBIT on currentBalance.
        REVERSAL, HOLD and RELEASE are reserved for refunds / NFC (later tickets).
      enum: [CREDIT, DEBIT, REVERSAL, HOLD, RELEASE]
    WalletResponse:
      type: object
      description: >
        Unique electronic wallet of the authenticated account (one wallet per user_id).
        Currency is always XAF (FCFA). Switching the active profile does not change this wallet.
      required: [id, currency, currentBalance, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
          description: ISO 4217 currency code. Fixed to XAF for MVP.
          enum: [XAF]
          example: XAF
        currentBalance:
          type: number
          format: double
          minimum: 0
          description: Settled balance derived from CREDIT minus DEBIT ledger entries.
          example: 15000.00
        status:
          $ref: '#/components/schemas/WalletStatus'
        createdAt:
          type: string
          format: date-time
    LedgerEntryResponse:
      type: object
      description: Immutable append-only ledger movement (audited, never updated in place).
      required: [id, type, amount, currency, bookedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/LedgerEntryType'
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 3000.00
        currency:
          type: string
          enum: [XAF]
          example: XAF
        reference:
          type: string
          nullable: true
          example: paiement-trajet
        bookedAt:
          type: string
          format: date-time
          description: Timestamp when the movement was booked.
    LedgerPageResponse:
      type: object
      description: Paginated ledger page, newest movements first.
      required: [entries, page, size, hasMore]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntryResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
          description: True when another page of movements is available.
    AnnouncementStatus:
      type: string
      description: Lifecycle status of an intercity announcement.
      enum: [DRAFT, PUBLISHED, FULL, CLOSED, CANCELLED]
    AnnouncementSort:
      type: string
      description: >
        Search sort key. proximity requires nearLat/nearLon and a departure geometry; otherwise
        the API falls back to departureTime.
      enum: [price, departureTime, proximity]
    GeoPointRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    CreateIntercityAnnouncementRequest:
      type: object
      description: >
        Publish an intercity announcement (CORE-INTER-001). Created as PUBLISHED with
        remainingSeats initialized to totalSeats. Departure datetime is interpreted in Africa/Douala
        and must be strictly in the future.
      required: [departureCity, destinationCity, departureDate, departureTime, priceFcfa, totalSeats, vehicleId]
      properties:
        departureCity:
          type: string
          maxLength: 120
          example: Douala
        destinationCity:
          type: string
          maxLength: 120
          example: Yaounde
        departureQuarter:
          type: string
          maxLength: 120
          nullable: true
          example: Bonanjo
        departurePoint:
          $ref: '#/components/schemas/GeoPointRequest'
        destinationPoint:
          $ref: '#/components/schemas/GeoPointRequest'
        departureDate:
          type: string
          format: date
          example: "2026-08-20"
        departureTime:
          type: string
          format: time
          example: "08:30:00"
        priceFcfa:
          type: number
          format: double
          minimum: 0
          example: 9000
        totalSeats:
          type: integer
          format: int32
          exclusiveMinimum: 0
          example: 14
        vehicleId:
          type: string
          format: uuid
        instructions:
          type: string
          maxLength: 2000
          nullable: true
    UpdateIntercityAnnouncementRequest:
      type: object
      description: >
        Partial update of a PUBLISHED or DRAFT announcement owned by the active profile.
        Refused when bookings already exist or status is CLOSED/CANCELLED/FULL.
      properties:
        departureCity:
          type: string
          maxLength: 120
        destinationCity:
          type: string
          maxLength: 120
        departureQuarter:
          type: string
          maxLength: 120
          nullable: true
        departurePoint:
          $ref: '#/components/schemas/GeoPointRequest'
        destinationPoint:
          $ref: '#/components/schemas/GeoPointRequest'
        departureDate:
          type: string
          format: date
        departureTime:
          type: string
          format: time
        priceFcfa:
          type: number
          format: double
          minimum: 0
        totalSeats:
          type: integer
          format: int32
          exclusiveMinimum: 0
        vehicleId:
          type: string
          format: uuid
        instructions:
          type: string
          maxLength: 2000
          nullable: true
    IntercityAnnouncementResponse:
      type: object
      required:
        - id
        - publisherProfileId
        - vehicleId
        - departureCity
        - destinationCity
        - departureDate
        - departureTime
        - priceFcfa
        - totalSeats
        - remainingSeats
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        publisherProfileId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          nullable: true
        departureCity:
          type: string
        destinationCity:
          type: string
        departureQuarter:
          type: string
          nullable: true
        departureDate:
          type: string
          format: date
        departureTime:
          type: string
          format: time
        priceFcfa:
          type: number
          format: double
        totalSeats:
          type: integer
          format: int32
        remainingSeats:
          type: integer
          format: int32
          description: >
            Seats still available. Decremented atomically when the announcement owner confirms a
            booking (SeatLock). Restored on cancel/expire of a non-consumed lock. Reaches 0 with
            status FULL when the trip is sold out.
        instructions:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BookingStatus:
      type: string
      description: >
        Lifecycle of an intercity booking (CORE-BOOK-001). Typical happy path:
        `PENDING` (subscription, awaiting owner confirm) → `PENDING_PAYMENT` (seats locked) →
        `PAID` (CORE-PAY-002). Terminal: `CANCELLED`, `EXPIRED`. `CONFIRMED` is reserved for
        seat-held states without an immediate payment window.
      enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED, PAID, PENDING_PAYMENT]
    CreateBookingRequest:
      type: object
      description: Passenger subscription body. Does not lock seats yet.
      required: [seatsRequested]
      properties:
        seatsRequested:
          type: integer
          format: int32
          exclusiveMinimum: 0
          example: 1
          description: Number of seats requested (must be <= announcement remainingSeats).
    CancelBookingRequest:
      type: object
      description: Cancellation motive required by business rules.
      required: [cancellationReason]
      properties:
        cancellationReason:
          type: string
          minLength: 1
          maxLength: 500
          example: Changement de plan
    BookingResponse:
      type: object
      description: >
        Intercity booking / subscription (CORE-BOOK-001). Readable by the passenger who created it
        and by the announcement owner (transporter/agency). `expiresAt` is the confirmation TTL
        while `PENDING`, then the payment TTL while `PENDING_PAYMENT`.
      required:
        - id
        - announcementId
        - passengerProfileId
        - status
        - seatsRequested
        - requestedAt
      properties:
        id:
          type: string
          format: uuid
        announcementId:
          type: string
          format: uuid
        passengerProfileId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
          nullable: true
          description: Optional linked trip id (populated by later tracking/payment flows).
        status:
          $ref: '#/components/schemas/BookingStatus'
        seatsRequested:
          type: integer
          format: int32
        requestedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the owner confirms and seats are locked.
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Deadline for owner confirmation (`PENDING`) or for payment (`PENDING_PAYMENT`).
            Past this instant a scheduler marks the booking `EXPIRED` and releases any SeatLock.
        cancellationReason:
          type: string
          nullable: true
    BookingPageResponse:
      type: object
      description: Paginated booking list (passenger mine or announcement owner list).
      required: [items, page, size, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
    WideningSuggestion:
      type: object
      description: Deterministic suggestion to broaden search criteria when the result set is empty.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [RELAX_DATE, RAISE_MAX_PRICE, DROP_QUARTER, DROP_TIME_RANGE, INCLUDE_FULL]
        message:
          type: string
          example: Essayer la veille ou le lendemain.
        suggestedQuery:
          type: object
          additionalProperties: true
          description: Query-parameter overrides the client can apply.
    IntercityAnnouncementSearchPageResponse:
      type: object
      required: [items, page, size, hasMore, wideningSuggestions]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntercityAnnouncementResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
        wideningSuggestions:
          type: array
          description: Populated only when items is empty; otherwise an empty array.
          items:
            $ref: '#/components/schemas/WideningSuggestion'
    IntercityAnnouncementMinePageResponse:
      type: object
      required: [items, page, size, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntercityAnnouncementResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
    DocumentType:
      type: string
      enum: [CNI, DRIVER_LICENSE, VEHICLE_REGISTRATION, INSURANCE, PROFILE_PHOTO, AGENCY_DOCUMENT, VEHICLE_PHOTO]
    DocumentStatus:
      type: string
      enum: [UPLOADED, ENCRYPTED, PENDING_REVIEW, ACCEPTED, REJECTED, EXPIRED]
    OfficialDocumentResponse:
      type: object
      required: [id, profileId, type, status, mimeType, sizeBytes, uploadedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/DocumentType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        fileName:
          type: string
          nullable: true
          example: carte-grise.jpg
        mimeType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
        rejectionReason:
          type: string
          nullable: true
        uploadedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentRequirementResponse:
      type: object
      required: [type, required, uploaded]
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        required:
          type: boolean
        uploaded:
          type: boolean
        latestStatus:
          allOf:
            - $ref: '#/components/schemas/DocumentStatus'
          nullable: true
    KycDocumentsResponse:
      type: object
      required: [profileId, profileType, profileValidationStatus, requirements, documents]
      properties:
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [MOTOTAXI, TRANSPORTER]
        profileValidationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRequirementResponse'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/OfficialDocumentResponse'
    UploadKycDocumentResponse:
      type: object
      required: [profileId, profileValidationStatus, document, requirements]
      properties:
        profileId:
          type: string
          format: uuid
        profileValidationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        document:
          $ref: '#/components/schemas/OfficialDocumentResponse'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRequirementResponse'
    AdminKycDocumentResponse:
      type: object
      required: [profileId, profileType, profileValidationStatus, displayName, documents, decisions]
      properties:
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [MOTOTAXI, TRANSPORTER]
        profileValidationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        displayName:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/OfficialDocumentResponse'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDecisionResponse'
    AdminKycQueueItemResponse:
      type: object
      required: [profileId, profileType, profileValidationStatus, displayName, documentsCount, pendingDocumentsCount]
      properties:
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum: [MOTOTAXI, TRANSPORTER]
        profileValidationStatus:
          type: string
          enum: [PENDING]
        displayName:
          type: string
        documentsCount:
          type: integer
          format: int64
        pendingDocumentsCount:
          type: integer
          format: int64
        oldestPendingDocumentAt:
          type: string
          format: date-time
          nullable: true
    KycDecision:
      type: string
      enum: [VALIDATE, REJECT]
    AdminKycDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/KycDecision'
        reason:
          type: string
          nullable: true
          description: Required when decision is REJECT.
    AdminKycDecisionResponse:
      type: object
      required: [profileId, profileValidationStatus, decision, decisionRecord]
      properties:
        profileId:
          type: string
          format: uuid
        profileValidationStatus:
          type: string
          enum: [VALIDATED, REJECTED]
        decision:
          $ref: '#/components/schemas/KycDecision'
        decisionRecord:
          $ref: '#/components/schemas/ValidationDecisionResponse'
    ValidationDecisionResponse:
      type: object
      required: [id, profileId, decision, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        adminProfileId:
          type: string
          format: uuid
          nullable: true
        decision:
          $ref: '#/components/schemas/KycDecision'
        reason:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
    PhoneRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          example: "+237699001122"
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [password, cguAccepted]
          properties:
            password:
              type: string
              format: password
              minLength: 8
            fullName:
              type: string
              maxLength: 160
            email:
              type: string
              format: email
            cguAccepted:
              type: boolean
    RegisterResponse:
      type: object
      required: [userId, phoneNumber, status, otpExpiresAt]
      properties:
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
        status:
          type: string
          example: PENDING_PHONE_VERIFICATION
        otpExpiresAt:
          type: string
          format: date-time
    OtpVerifyRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [code]
          properties:
            purpose:
              type: string
              description: Defaults to REGISTRATION when omitted.
              enum: [REGISTRATION, LOGIN, PASSWORD_RESET, PAYMENT_CONFIRMATION]
            code:
              type: string
              pattern: '^[0-9]+$'
    OtpResendRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          properties:
            purpose:
              type: string
              description: Defaults to REGISTRATION when omitted.
              enum: [REGISTRATION, LOGIN, PASSWORD_RESET, PAYMENT_CONFIRMATION]
    OtpVerifyResponse:
      type: object
      required: [userId, phoneNumber, status]
      properties:
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
        status:
          type: string
          example: ACTIVE
    OtpResendResponse:
      type: object
      required: [phoneNumber, purpose, otpExpiresAt]
      properties:
        phoneNumber:
          type: string
        purpose:
          type: string
        otpExpiresAt:
          type: string
          format: date-time
    LoginRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [password]
          properties:
            password:
              type: string
              format: password
            deviceId:
              type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthTokenResponse:
      type: object
      required: [tokenType, accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt, sessionId, userId, phoneNumber, roles, profiles, permissions]
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        phoneNumber:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileTokenSummary'
        activeProfileId:
          type: string
          format: uuid
          nullable: true
        activeProfileType:
          type: string
          nullable: true
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        permissions:
          type: array
          items:
            type: string
    ProfileTokenSummary:
      type: object
      required: [id, type, validationStatus, active]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        validationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        active:
          type: boolean
    CreateProfileRequest:
      type: object
      required: [type, displayName]
      properties:
        type:
          type: string
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY]
        displayName:
          type: string
          maxLength: 120
        avatarUrl:
          type: string
          maxLength: 2048
        passenger:
          $ref: '#/components/schemas/PassengerProfileDetails'
        driver:
          $ref: '#/components/schemas/DriverProfileDetails'
        motoTaxi:
          $ref: '#/components/schemas/MotoTaxiProfileDetails'
        transporter:
          $ref: '#/components/schemas/TransporterProfileDetails'
        agency:
          $ref: '#/components/schemas/AgencyProfileDetails'
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 120
        avatarUrl:
          type: string
          maxLength: 2048
        passenger:
          $ref: '#/components/schemas/PassengerProfileDetails'
        driver:
          $ref: '#/components/schemas/DriverProfileDetails'
        motoTaxi:
          $ref: '#/components/schemas/MotoTaxiProfileDetails'
        transporter:
          $ref: '#/components/schemas/TransporterProfileDetails'
        agency:
          $ref: '#/components/schemas/AgencyProfileDetails'
    PassengerProfileDetails:
      type: object
      properties:
        preferredLanguage:
          type: string
          maxLength: 16
          example: fr
        emergencyContact:
          type: string
          maxLength: 20
          example: "+237699000001"
    DriverProfileDetails:
      type: object
      properties:
        availability:
          type: string
          readOnly: true
          enum: [AVAILABLE, OCCUPIED, OFFLINE]
        gpsConsent:
          type: boolean
        lastAvailabilityChangeAt:
          type: string
          format: date-time
          readOnly: true
    MotoTaxiProfileDetails:
      type: object
      properties:
        licenseNumber:
          type: string
          maxLength: 80
        operatingZone:
          type: string
          maxLength: 160
    TransporterProfileDetails:
      type: object
      properties:
        permitNumber:
          type: string
          maxLength: 80
        companyName:
          type: string
          maxLength: 160
        vehicleId:
          type: string
          format: uuid
          nullable: true
          description: >
            Primary vehicle linked to the transporter profile. Set automatically when uploading
            VEHICLE_PHOTO (provided vehicleId, existing primary vehicle, or newly created vehicle).
    AgencyProfileDetails:
      type: object
      properties:
        legalName:
          type: string
          maxLength: 180
        tradeRegisterNumber:
          type: string
          maxLength: 80
        billingPlan:
          type: string
          maxLength: 80
    AdminProfileDetails:
      type: object
      readOnly: true
      properties:
        adminRole:
          type: string
        permissions:
          type: array
          items:
            type: string
    ProfileResponse:
      type: object
      required: [id, userId, type, validationStatus, displayName, averageRating, active, createdAt, updatedAt, allowedActions]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [PASSENGER, MOTOTAXI, TRANSPORTER, AGENCY, ADMIN]
        validationStatus:
          type: string
          enum: [DRAFT, PENDING, VALIDATED, REJECTED, SUSPENDED]
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        averageRating:
          type: number
          format: double
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        passenger:
          $ref: '#/components/schemas/PassengerProfileDetails'
        driver:
          $ref: '#/components/schemas/DriverProfileDetails'
        motoTaxi:
          $ref: '#/components/schemas/MotoTaxiProfileDetails'
        transporter:
          $ref: '#/components/schemas/TransporterProfileDetails'
        agency:
          $ref: '#/components/schemas/AgencyProfileDetails'
        admin:
          $ref: '#/components/schemas/AdminProfileDetails'
        allowedActions:
          type: array
          items:
            type: string
    ResetPasswordRequest:
      allOf:
        - $ref: '#/components/schemas/PhoneRequest'
        - type: object
          required: [code, newPassword]
          properties:
            code:
              type: string
            newPassword:
              type: string
              format: password
              minLength: 8
    PaymentRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          enum: [XAF]
        provider:
          type: string
          enum: [MTN_MOMO, ORANGE_MONEY, AGGREGATOR, WALLET, NFC]
        phoneNumber:
          type: string
    DepositRequest:
      type: object
      description: Mobile Money wallet deposit initiation (CORE-PAY-001).
      required: [amount, currency, provider, phoneNumber]
      properties:
        amount:
          type: number
          format: double
          minimum: 1
          example: 5000.00
        currency:
          type: string
          enum: [XAF]
        provider:
          type: string
          enum: [MTN_MOMO, ORANGE_MONEY, AGGREGATOR]
        phoneNumber:
          type: string
          pattern: '^\+237[6-9]\d{8}$'
          example: '+237699001122'
    DepositResponse:
      type: object
      description: Mobile Money deposit transaction state.
      required: [id, status, amount, currency, provider, initiatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [INITIATED, PENDING_CALLBACK, CONFIRMED, FAILED, EXPIRED, REFUNDED]
        amount:
          type: number
          format: double
        currency:
          type: string
          enum: [XAF]
        provider:
          type: string
          enum: [MTN_MOMO, ORANGE_MONEY, AGGREGATOR]
        payerPhone:
          type: string
          nullable: true
        externalReference:
          type: string
          nullable: true
          description: Provider reference used for reconciliation.
        failureReason:
          type: string
          nullable: true
        initiatedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
    MobileMoneyCallbackRequest:
      type: object
      description: >
        Normalized callback payload forwarded by the gateway after HMAC/origin/idempotency checks.
      required: [externalReference, status]
      properties:
        externalReference:
          type: string
          example: MTN-20260702-8A91
        status:
          type: string
          enum: [SUCCESS, SUCCESSFUL, CONFIRMED, FAILED, FAILURE, REJECTED, EXPIRED, TIMEOUT]
        failureReason:
          type: string
          nullable: true
    AdminPaymentTransactionPageResponse:
      type: object
      required: [transactions, page, size, hasMore]
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/DepositResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        hasMore:
          type: boolean
    PricingEstimateRequest:
      type: object
      required: [originLat, originLon, destinationLat, destinationLon]
      properties:
        originLat:
          type: number
          format: double
        originLon:
          type: number
          format: double
        destinationLat:
          type: number
          format: double
        destinationLon:
          type: number
          format: double
        origin:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/GeoPoint'
        serviceType:
          type: string
    PricingBreakdown:
      type: object
      required: [baseFcfa, distanceKm, pricePerKmFcfa, distanceAmountFcfa, nightMultiplier, weatherMultiplier, nightWeatherApplicable, roundingFcfa, totalFcfa]
      properties:
        baseFcfa:
          type: number
        distanceKm:
          type: number
          format: double
        pricePerKmFcfa:
          type: number
        distanceAmountFcfa:
          type: number
        nightMultiplier:
          type: number
        weatherMultiplier:
          type: number
        nightWeatherApplicable:
          type: boolean
        roundingFcfa:
          type: number
        totalFcfa:
          type: number
    PricingRouteOption:
      type: object
      required: [kind, label, degraded, distanceKm, durationMinutes, amountFcfa, polyline]
      properties:
        kind:
          type: string
          enum: [RECOMMENDED, FASTEST, CHEAPEST]
        label:
          type: string
        degraded:
          type: boolean
        distanceKm:
          type: number
          format: double
        durationMinutes:
          type: integer
          format: int32
        amountFcfa:
          type: number
        polyline:
          type: string
          description: WKT LINESTRING
        reason:
          type: string
          nullable: true
    PricingEstimateResponse:
      type: object
      required: [amountFcfa, distanceKm, durationMinutes, polyline, options, breakdown]
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        amountFcfa:
          type: number
        distanceKm:
          type: number
          format: double
        durationMinutes:
          type: integer
          format: int32
        appliedRulesTrace:
          type: string
        polyline:
          type: string
        status:
          type: string
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
        calculatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        breakdown:
          $ref: '#/components/schemas/PricingBreakdown'
        options:
          type: array
          description: >
            Distinct route variants (1–3). Duplicate geometries are collapsed.
            Primary top-level fields come from RECOMMENDED when present, otherwise FASTEST.
          items:
            $ref: '#/components/schemas/PricingRouteOption'
    UrbanPlaceResponse:
      type: object
      required: [id, label, lat, lon, kind]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        kind:
          type: string
          enum: [NEIGHBORHOOD, POI, LANDMARK, STREET, LOCALITY, CITY]
        subtitle:
          type: string
        source:
          type: string
          enum: [LOCAL, PHOTON]
        distanceKm:
          type: number
          format: double
    RoutePreviewRequest:
      type: object
      required: [originLat, originLon, destinationLat, destinationLon]
      properties:
        originLat:
          type: number
          format: double
        originLon:
          type: number
          format: double
        destinationLat:
          type: number
          format: double
        destinationLon:
          type: number
          format: double
        costing:
          type: string
          description: Valhalla costing model. Use auto for intercity cars; motorcycle remains the urban default.
          enum: [auto, motorcycle, bicycle, pedestrian]
    RoutePreviewResponse:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        engine:
          type: string
            enum: [VALHALLA, LOCAL, DIRECT]
        polyline:
          type: string
        distanceKm:
          type: number
          format: double
        durationMinutes:
          type: integer
        status:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/PricingRouteOption'
        alternatives:
          type: array
          items:
            type: object
    RouteMatchRequest:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 2
          items:
            type: object
            required: [lat, lon]
            properties:
              lat:
                type: number
                format: double
              lon:
                type: number
                format: double
    RouteMatchResponse:
      type: object
      properties:
        polyline:
          type: string
        distanceKm:
          type: number
          format: double
        durationMinutes:
          type: integer
        engine:
          type: string
    TrafficLayerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CONGESTION, ROADWORK, DAMAGED_ROAD, ALTERNATIVE_ROUTE]
          description: >
            DAMAGED_ROAD is the closest mapping for Figma "zones à éviter".
            No separate avoid-zone type is introduced.
        label:
          type: string
        geometryWkt:
          type: string
        geoJson:
          type: string
        severity:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
        source:
          type: string
        updatedAt:
          type: string
          format: date-time
          description: Freshness timestamp derived from validFrom.
        fresh:
          type: boolean
          description: True when the layer is active and currently inside validFrom/validTo.
    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    ServerSentEvent:
      type: object
      properties:
        event:
          type: string
        id:
          type: string
        data:
          type: object
          additionalProperties: true
  responses:
    Accepted:
      description: Request accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
    Empty:
      description: Request completed without response body.
    Error:
      description: Stable error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
security:
  - BearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a phone account and send a registration OTP.
      operationId: registerAccount
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created pending phone verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an OTP for registration, login, payment, or reset.
      description: >
        On successful REGISTRATION OTP verification the account becomes ACTIVE and an XAF wallet is
        auto-created (CORE-WALLET-001). The wallet is tied to the user account, not to a profile.
      operationId: verifyOtp
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/otp/resend:
    post:
      tags: [Auth]
      summary: Resend an OTP subject to cooldown and quotas.
      operationId: resendOtp
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
      responses:
        '202':
          description: OTP resend accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResendResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and create an access/refresh session.
      description: >
        Successful login also ensures an ACTIVE XAF wallet exists for the account (lazy backfill for
        legacy ACTIVE users without a wallet row — CORE-WALLET-001).
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate an opaque refresh token and issue a new access token.
      operationId: refreshSession
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session identified by the JWT sid claim.
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Send a password reset OTP with anti-enumeration behavior.
      operationId: forgotPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset a password with a valid reset OTP and revoke sessions.
      operationId: resetPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          $ref: '#/components/responses/Empty'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/profiles:
    get:
      tags: [Profiles]
      summary: List profiles owned by the authenticated user.
      operationId: listProfiles
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Profiles owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Profiles]
      summary: Create a user profile.
      operationId: createProfile
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/profiles/current:
    get:
      tags: [Profiles]
      summary: Get the active profile and its allowed actions.
      operationId: getCurrentProfile
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Active profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/profiles/{profileId}:
    patch:
      tags: [Profiles]
      summary: Update a profile owned by the authenticated user.
      operationId: updateProfile
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/profiles/active/{profileId}:
    patch:
      tags: [Profiles]
      summary: Select the active profile for the current user.
      operationId: activateProfile
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Activated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/kyc/documents:
    get:
      tags: [KYC]
      summary: List required and uploaded KYC documents for the active profile.
      operationId: listCurrentKycDocuments
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: KYC requirements and uploaded documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDocumentsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [KYC]
      summary: Upload a KYC document.
      operationId: uploadKycDocument
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  $ref: '#/components/schemas/DocumentType'
                vehicleId:
                  type: string
                  format: uuid
                  description: >
                    Optional owned vehicle id. For TRANSPORTER VEHICLE_PHOTO uploads, when omitted
                    the API reuses the profile primary vehicle or creates one and links it.
      responses:
        '201':
          description: Uploaded encrypted document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadKycDocumentResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/vehicles/mine:
    get:
      tags: [Intercity]
      summary: List vehicles owned by the active transporter or agency profile.
      operationId: listMyVehicles
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
  /api/v1/vehicles/{id}/photo:
    get:
      tags: [Intercity]
      summary: Download a vehicle photo.
      operationId: getVehiclePhoto
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
  /api/v1/drivers/position:
    put:
      tags: [SIG]
      summary: Publish the current driver position.
      operationId: updateDriverPosition
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoPoint'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
    get:
      tags: [SIG]
      summary: Read the last published driver position.
      operationId: getDriverPosition
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
  /api/v1/drivers/availability:
    patch:
      tags: [SIG]
      summary: Update mototaxi availability and GPS consent.
      operationId: updateDriverAvailability
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
  /api/v1/realtime/sse:
    get:
      tags: [SIG]
      summary: Subscribe to GPS realtime events via SSE.
      operationId: subscribeRealtimeSse
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
  /api/v1/gis/layers:
    get:
      tags: [SIG]
      summary: List active traffic layers for mobile maps.
      description: >
        Existing overlay source (CONGESTION, ROADWORK, DAMAGED_ROAD, ALTERNATIVE_ROUTE).
        DAMAGED_ROAD maps Figma "zones à éviter". Includes updatedAt/fresh from validFrom/validTo.
      operationId: listActiveGisLayers
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Active traffic layers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrafficLayerResponse'
  /api/v1/urban/drivers/nearby:
    get:
      tags: [SIG]
      summary: Search nearby urban drivers.
      operationId: findNearbyUrbanDrivers
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: radiusKm
          in: query
          schema:
            type: number
            format: double
        - name: destLat
          in: query
          schema:
            type: number
            format: double
        - name: destLon
          in: query
          schema:
            type: number
            format: double
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
